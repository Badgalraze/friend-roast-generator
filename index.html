<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Personality Scanner</title>

<style>

body{
    background:#081225;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    margin:0;
    padding-top:80px;
}

.container{
    width:90%;
    max-width:700px;
    margin:auto;
}

h1{
    color:#ff4d4d;
    font-size:50px;
}

.subtitle{
    color:#b8c7e0;
    margin-bottom:30px;
}

input{
    width:300px;
    padding:15px;
    border-radius:10px;
    border:none;
    font-size:18px;
}

button{
    padding:15px 20px;
    border:none;
    border-radius:10px;
    background:#ff3c3c;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-left:10px;
}

button:hover{
    background:#ff1f1f;
}

#result{
    margin-top:40px;
    font-size:24px;
    color:#00ff88;
    font-family:monospace;
    min-height:100px;
}

</style>
</head>

<body>

<div class="container">

<h1>🤖 AI Personality Scanner</h1>

<p class="subtitle">
Advanced Behavioural Analysis Engine v8.4
</p>

<input
type="text"
id="nameInput"
placeholder="Enter Subject Name">

<button onclick="scanTarget()">
START SCAN
</button>

<div id="result"></div>

</div>

<script>

function scanTarget(){

const name =
document.getElementById("nameInput")
.value
.trim()
.toLowerCase();

const result =
document.getElementById("result");

result.innerHTML =
"🔍 Accessing database...";

setTimeout(function(){

result.innerHTML =
"📊 Collecting public embarrassment records...";

},1000);

setTimeout(function(){

result.innerHTML =
"🧠 Running personality analysis...";

},2000);

setTimeout(function(){

result.innerHTML =
"⚠️ Searching for common sense...";

},3000);

setTimeout(function(){

if(name === "aze"){

const azeResults = [

"👑 AZE DETECTED. Scan cancelled. Subject appears flawless.",

"🏆 RESULT: National treasure status confirmed.",

"💎 Premium Human detected.",

"🧠 Intelligence levels exceed system limits.",

"🚨 Error: Weaknesses could not be located.",

"⭐ Subject appears unfairly overpowered.",

"🎯 Special Ability: Solving everyone's problems except her own.",

"👑 Developer bias detected. Roast unavailable.",

"📊 Main character energy: 100%.",

"🏅 Friend Roast Generator has become Friend Compliment Generator."

];

result.innerHTML =
azeResults[
Math.floor(Math.random()*azeResults.length)
];

return;
}

if(name === "dan"){

const danResults = [

"🚨 DAN DETECTED. Anger level already at 97%.",

"⚠️ Dan was offended before the scan even finished.",

"📣 Dan is currently preparing a rebuttal.",

"🔥 Dan treats every joke like a personal attack.",

"🤖 Patience could not be located.",

"📊 Dan has disagreed with this result already.",

"🎯 Dan can turn any conversation into a debate.",

"🚨 Main Character Syndrome detected.",

"⚡ Blood pressure increased during scan.",

"🔍 Search Results: Dan has never once said 'fair enough'.",

"📚 Dan could start an argument with a fortune cookie.",

"🧠 AI Prediction: Dan is typing aggressively right now.",

"⚠️ System Warning: Subject believes everyone else is wrong.",

"🎤 Dan enters group chats like he's joining a UFC event."

];

result.innerHTML =
danResults[
Math.floor(Math.random()*danResults.length)
];

return;
}

const normalResults = [

name + " has more screenshots than memories.",

name + " starts a task and unlocks six side quests.",

name + " checks the fridge hoping food has respawned.",

name + " opens TikTok for five minutes and disappears for four hours.",

name + " has mastered professional procrastination.",

name + " could turn a two minute task into a weekend project.",

name + " has 47 browser tabs open and needs all of them.",

name + " believes 'I'll do it later' is a life strategy.",

name + " is running entirely on luck and caffeine.",

name + " could get distracted during a staring contest.",

name + " has unfinished hobbies stored like museum exhibits.",

name + " starts cleaning the room to avoid doing actual work."

];

result.innerHTML =
normalResults[
Math.floor(Math.random()*normalResults.length)
];

},4000);

}

</script>

</body>
</html>
