<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Friend Roast Generator</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    margin:0;
    padding-top:100px;
}

h1{
    color:#ff4d4d;
}

input{
    padding:15px;
    width:300px;
    border:none;
    border-radius:10px;
    font-size:18px;
}

button{
    padding:15px 25px;
    border:none;
    border-radius:10px;
    background:#ff3b3b;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-left:10px;
}

button:hover{
    background:#ff1f1f;
}

#result{
    margin-top:40px;
    font-size:24px;
    color:#00ff99;
    font-family:monospace;
    text-shadow:0 0 8px #00ff99;
}

</style>

</head>

<body>

<h1>🔥 Friend Roast Generator 🔥</h1>

<p>Advanced AI Personality Analysis System v4.2</p>

<input
id="nameInput"
placeholder="Enter friend's name">

<button onclick="roastFriend()">
Analyze Subject
</button>

<div id="result"></div>

<script>

function roastFriend(){

    let name =
    document.getElementById("nameInput")
    .value
    .trim()
    .toLowerCase();

    let result =
    document.getElementById("result");

    result.innerHTML =
    "🔍 Scanning subject...";

    setTimeout(function(){

        result.innerHTML =
        "📊 Gathering embarrassing data...";

    },1000);

    setTimeout(function(){

        result.innerHTML =
        "🧠 Analyzing personality...";

    },2000);

    setTimeout(function(){

        result.innerHTML =
        "⚠️ Finding weaknesses...";

    },3000);

    setTimeout(function(){

        if(name === "aze"){

            let azeRoasts = [

                "👑 AZE DETECTED. Scan cancelled. Subject appears flawless.",

                "🏆 Result: Aze has been promoted from friend to national treasure.",

                "💎 Premium Human detected.",

                "🧠 Intelligence Scan Complete. No weaknesses found.",

                "✨ Main Character Energy detected.",

                "🚨 Error 404: Roast Not Found.",

                "🏅 Subject appears unfairly overpowered.",

                "🔥 Too iconic to roast.",

                "🎯 Special Ability: Solving everyone's problems except her own.",

                "⭐ System Override: Aze automatically wins."

            ];

            result.innerHTML =
            azeRoasts[
                Math.floor(
                Math.random() *
                azeRoasts.length
                )
            ];

            return;
        }

        if(name === "dan"){

            let danRoasts = [

                "🚨 DAN DETECTED. Anger level already at 97%.",

                "⚠️ Dan was offended before the scan finished.",

                "🤖 Dan's patience could not be located.",

                "🔥 Dan treats every joke like a court case.",

                "📣 Dan is currently writing a 17-page rebuttal.",

                "🎯 Dan can turn any conversation into an argument.",

                "🚨 ALERT: Dan disagrees with these results.",

                "🧠 AI Prediction: Dan is typing aggressively.",

                "⚡ Dan's blood pressure increased by 4% during this scan."

            ];

            result.innerHTML =
            danRoasts[
                Math.floor(
                Math.random() *
                danRoasts.length
                )
            ];

            return;
        }

        let randomRoasts = [

            name + " has more screenshots than memories.",

            name + " starts a task and unlocks six side quests.",

            name + " opens TikTok for five minutes and disappears for four hours.",

            name + " treats low battery like a personality trait.",

            name + " has 47 browser tabs open and somehow needs all of them.",

            name + " has mastered the art of procrastination.",

            name + " could turn a two minute task into an entire weekend project.",

            name + " checks the fridge hoping new food has spawned.",

            name + " believes 'I'll do it later' is a productivity strategy."

        ];

        result.innerHTML =
        randomRoasts[
            Math.floor(
            Math.random() *
            randomRoasts.length
            )
        ];

    },4000);

}

</script>

</body>
</html>
